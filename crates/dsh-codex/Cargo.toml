[package]
name = "dsh-codex"
description = "Codex DeepSeek Harness: a fast, lean coding agent for DeepSeek"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dsh-codex"
path = "src/main.rs"

[dependencies]
dshx-core.workspace = true
dshx-llm.workspace = true
dshx-session.workspace = true
dshx-tools.workspace = true
dshx-agent.workspace = true
dshx-browser.workspace = true
dshx-macos.workspace = true
dshx-server.workspace = true
dshx-subagent.workspace = true
dshx-mcp.workspace = true
dshx-plugins.workspace = true
dshx-goal.workspace = true
dshx-schedule.workspace = true
dshx-team.workspace = true
dshx-orchestrator.workspace = true
# The Pi coding agent as a second chat engine.
dshx-pi.workspace = true
# The Aether accounts hub: `dsh-codex hub enroll` and the relay of `web`.
dshx-hub.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
ignore = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# `dsh-codex pair --ssh`: an ed25519 key for the phone, made in memory.
ssh-key = { version = "0.6", features = ["ed25519", "std", "getrandom"] }
time = "0.3"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true

# `dsh-codex web`: one server per data directory (`flock` on `run/web.lock`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
dshx-testkit.workspace = true
reqwest.workspace = true
tempfile.workspace = true
