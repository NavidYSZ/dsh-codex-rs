[package]
name = "dshx-server"
description = "Local HTTP/WebSocket server for the dsh-codex web UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dshx-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
sha2 = "0.10"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
mime_guess = "2"
uuid.workspace = true
# Aether app: client tokens, the TLS listener, pairing payloads and QR codes.
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
time = "0.3"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
socket2 = "0.6"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false }
# Folder transfer between instances: tar+zstd streams.
tar.workspace = true
zstd.workspace = true
filetime = "0.2"

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio-tungstenite = "0.28"
