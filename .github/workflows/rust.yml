name: rust

on:
  push:
    branches: [rust, main]
  pull_request:
    branches: [rust, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Tests that need bubblewrap or Chromium skip themselves when those are
      # missing; on Linux we install bwrap so the sandbox tests run.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  helper:
    name: Swift helper (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The mini window uses NSGlassEffectView, which needs the macOS 26 SDK
      # (Xcode 26); pick the newest stable Xcode on the runner.
      - name: Select Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -iv beta | python3 -c 'import re, sys; apps = [a for a in sys.stdin.read().split("\n") if a]; print(max(apps, key=lambda a: [int(n) for n in re.findall(r"\d+", a)]) if apps else "")')
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Build (no signing, no install)
        run: helper/build.sh --no-sign

      - name: Check the bundle
        run: |
          app="helper/build/DSH Computer Use.app"
          test -x "$app/Contents/MacOS/dsh-cua"
          lipo -archs "$app/Contents/MacOS/dsh-cua"
          plutil -lint "$app/Contents/Info.plist"
